name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  # Semgrep is used instead of CodeQL: CodeQL needs GitHub Advanced Security
  # (Team/Enterprise on private repos). Semgrep runs free with no plan requirement.
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/default --config p/javascript --sarif --output semgrep-results.sarif || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (if any)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install --package-lock=false
          else
            echo "No package.json found"
          fi
      - name: Run npm audit (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          npm audit --json > npm-audit.json || true
      - name: Upload npm audit report
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
